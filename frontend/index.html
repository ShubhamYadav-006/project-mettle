  <!-- Immediate theme application script to prevent theme flash -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('mettle-theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
